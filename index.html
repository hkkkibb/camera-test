<!doctype html>
<html lang="ko">
<head>
<base target="_top">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
</head>
<body>
<title>통합 카메라앨범 보드판</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;600;700&display=swap">
<style>
  /* 카메라가 화면을 채우는 한 화면 구조: 위 상태줄, 가운데 촬영 화면, 아래 큰 버튼 */
  :root {
    --bar: #101614;
    --bar-line: #33403b;
    --white: #ffffff;
    --soft: #b9c4bf;
    --on: #2c6e4f;
    --ink: #17231f;
    --sheet: #f3f5f2;
    --line: #cfd6d1;
    --sheet-soft: #55645f;
    --font: "IBM Plex Sans KR", "Noto Sans KR", "Malgun Gothic", system-ui, sans-serif;
    color-scheme: dark;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; overflow: hidden; }
  body { background: #000; color: var(--white); font: 400 16px/1.4 var(--font); word-break: keep-all; }
  button, input { font: inherit; color: inherit; }
  button { cursor: pointer; }
  :focus-visible { outline: 3px solid #6cb4ff; outline-offset: 2px; }

  .app { display: flex; flex-direction: column; height: 100%; }
  .top { flex: none; display: flex; align-items: center; justify-content: space-between; gap: 8px; min-height: 56px; padding-block: 6px; padding-left: max(12px, env(safe-area-inset-left, 0px)); padding-right: max(12px, env(safe-area-inset-right, 0px)); background: var(--bar); }
  .status { min-width: 0; margin: 0; font-size: 14px; line-height: 1.3; color: var(--soft); }
  .switch { flex: none; display: flex; align-items: center; gap: 8px; min-height: 44px; padding: 4px 6px 4px 12px; background: none; border: 1px solid var(--soft); border-radius: 4px; font-weight: 700; color: var(--white); }
  .switch b { min-width: 44px; padding: 4px 6px; background: #5b6763; border-radius: 3px; font-size: 14px; text-align: center; color: var(--white); }
  .switch[aria-pressed="true"] b { background: var(--on); }

  .stage { position: relative; flex: 1 1 0; min-height: 0; background: #000; overflow: hidden; }
  .stage video, .stage canvas { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: contain; display: block; }

  .bottom { flex: none; display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; gap: 12px; padding-block: 10px calc(10px + env(safe-area-inset-bottom, 0px)); padding-left: max(12px, env(safe-area-inset-left, 0px)); padding-right: max(12px, env(safe-area-inset-right, 0px)); background: var(--bar); }
  .side { min-height: 60px; padding: 4px; background: none; border: 1px solid var(--bar-line); border-radius: 4px; font-size: 15px; font-weight: 600; color: var(--white); line-height: 1.25; }
  .side:disabled { opacity: .4; cursor: default; }
  .shutter { width: 76px; height: 76px; padding: 0; background: var(--white); border: 5px solid var(--bar); outline: 3px solid var(--white); border-radius: 50%; }
  .shutter:active { background: var(--soft); }
  .side.save { min-width: 76px; background: var(--white); color: var(--ink); border-color: var(--white); font-weight: 700; }
  .primary { min-height: 60px; background: var(--white); color: var(--ink); border: 0; border-radius: 4px; font-size: 18px; font-weight: 700; }

  /* 아래에서 올라오는 입력 칸: 보드판을 보면서 고치도록 화면의 절반까지만 차지합니다 */
  .sheet { position: fixed; left: 0; right: 0; bottom: 0; z-index: 5; display: flex; flex-direction: column; max-height: 58%; background: var(--sheet); color: var(--ink); border-top: 3px solid var(--ink); padding-bottom: env(safe-area-inset-bottom, 0px); color-scheme: light; }
  .sheet-head { flex: none; display: flex; align-items: center; justify-content: space-between; gap: 8px; min-height: 56px; padding-block: 4px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(8px, env(safe-area-inset-right, 0px)); border-bottom: 1px solid var(--line); }
  .sheet-head h2 { margin: 0; font-size: 18px; }
  .done { min-height: 44px; padding: 0 16px; background: var(--ink); color: var(--white); border: 0; border-radius: 4px; font-weight: 700; }
  .sheet-body { flex: 1 1 auto; min-height: 0; overflow-y: auto; -webkit-overflow-scrolling: touch; padding-block: 10px 14px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); display: grid; gap: 10px; align-content: start; }
  .row { display: grid; grid-template-columns: 96px minmax(0, 1fr) 44px; gap: 6px; align-items: center; }
  .row input { width: 100%; min-width: 0; min-height: 46px; padding: 4px 8px; background: var(--white); color: var(--ink); border: 1px solid var(--sheet-soft); border-radius: 4px; font-size: 16px; }
  .row .name { font-weight: 700; background: #e8ece9; }
  .remove { width: 44px; min-height: 46px; padding: 0; background: var(--white); color: var(--ink); border: 1px solid var(--sheet-soft); border-radius: 4px; font-size: 13px; font-weight: 600; }
  .sheet-actions { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .sheet-actions button { min-height: 46px; background: var(--white); color: var(--ink); border: 2px solid var(--ink); border-radius: 4px; font-weight: 700; }
  .sheet-actions button:disabled { opacity: .5; }
  .note { margin: 0; min-height: 19px; font-size: 14px; color: var(--sheet-soft); }
  .tools { position: absolute; top: 8px; left: 8px; z-index: 2; display: flex; gap: 6px; }
  .tool { min-width: 44px; min-height: 44px; padding: 0 10px; background: rgba(16, 22, 20, .78); border: 1px solid var(--soft); border-radius: 4px; color: var(--white); font-size: 14px; font-weight: 700; }
  .tool:disabled { opacity: .45; cursor: default; }
  .zoom { display: flex; align-items: center; gap: 2px; }
  .zoom output { min-width: 42px; padding: 0 2px; text-align: center; font-size: 14px; font-weight: 700; text-shadow: 0 0 3px #000; }
  .hint { position: absolute; inset: 0; z-index: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 8px; padding: 16px; text-align: center; }
  .hint strong { font-size: 22px; }
  .hint p { margin: 0; color: var(--soft); }
  .full { position: absolute; top: 8px; right: 8px; z-index: 2; display: none; min-height: 44px; padding: 0 12px; background: rgba(16, 22, 20, .78); border: 1px solid var(--soft); border-radius: 4px; color: var(--white); font-size: 14px; font-weight: 600; }

  /* 가로로 들었을 때: 사진을 최대한 크게 보여 주고 버튼은 오른쪽 세로 줄로 옮깁니다 */
  @media (orientation: landscape) and (max-height: 600px) {
    .app { display: grid; grid-template-columns: minmax(0, 1fr) 112px; grid-template-rows: auto minmax(0, 1fr); }
    .stage { grid-column: 1; grid-row: 1 / 3; }
    .top { grid-column: 2; grid-row: 1; display: block; min-height: 0; padding: 6px 6px 0 6px; padding-top: max(6px, env(safe-area-inset-top, 0px)); padding-right: max(6px, env(safe-area-inset-right, 0px)); }
    .switch { width: 100%; justify-content: space-between; padding-left: 8px; font-size: 14px; }
    .switch b { min-width: 34px; padding: 3px 4px; font-size: 13px; }
    .status { position: fixed; left: 8px; top: 8px; z-index: 2; max-width: 60%; padding: 4px 8px; background: rgba(16, 22, 20, .78); color: var(--white); font-size: 13px; border-radius: 3px; pointer-events: none; }
    .status.ok { display: none; }
    .bottom { grid-column: 2; grid-row: 2; grid-template-columns: minmax(0, 1fr); grid-template-rows: 1fr auto 1fr; justify-items: center; gap: 6px; padding: 6px; padding-right: max(6px, env(safe-area-inset-right, 0px)); padding-bottom: max(6px, env(safe-area-inset-bottom, 0px)); min-height: 0; }
    .side { width: 100%; min-height: 44px; height: 100%; max-height: 72px; font-size: 14px; }
    .shutter { width: 66px; height: 66px; }
    .bottom > span { display: none; }
    #reviewBar { grid-template-rows: repeat(3, 1fr); }
    .full { display: block; }
    .sheet { left: auto; top: 0; width: min(440px, 58%); max-height: none; border-top: 0; border-left: 3px solid var(--ink); padding-right: env(safe-area-inset-right, 0px); }
  }
  [hidden] { display: none !important; }
</style>

<div class="app">
  <header class="top">
    <p class="status" id="status" role="status">카메라를 여는 중입니다.</p>
    <button class="switch" id="boardSwitch" type="button" aria-pressed="true">보드판 <b id="switchText">켜짐</b></button>
  </header>

  <section class="stage" aria-label="촬영 화면">
    <video id="video" playsinline muted autoplay hidden></video>
    <div class="tools" id="tools" hidden>
      <button class="tool" id="lensNext" type="button" hidden>렌즈 1/1</button>
      <div class="zoom" id="zoomBox" hidden>
        <button class="tool" id="zoomOut" type="button" aria-label="축소">−</button>
        <output id="zoomValue">1.0×</output>
        <button class="tool" id="zoomIn" type="button" aria-label="확대">+</button>
      </div>
    </div>
    <canvas id="photo" hidden></canvas>
    <canvas id="board" role="img" aria-label="보드판 표시"></canvas>
    <button class="full" id="fullButton" type="button" hidden>전체 화면</button>
    <div class="hint" id="hint" hidden>
      <strong>기본 카메라 사용 중</strong>
      <p>아래 동그라미를 누르면 휴대폰 기본 카메라가 열립니다.</p>
      <p id="nativeCount"></p>
    </div>
  </section>

  <footer class="bottom" id="shootBar">
    <button class="side" id="editOpen" type="button">내용 입력</button>
    <button class="shutter" id="shutter" type="button" aria-label="사진 찍기"></button>
    <button class="side" id="cornerNext" type="button">위치<br><span id="cornerText">왼쪽 아래</span></button>
  </footer>

  <footer class="bottom" id="reviewBar" hidden>
    <button class="side" id="retake" type="button">다시 찍기</button>
    <button class="side save" id="testSave" type="button" hidden>시험 저장</button>
    <span id="saveSpacer"></span>
    <button class="side" id="editOpen2" type="button">내용 고치기</button>
  </footer>
</div>

<input id="nativeInput" type="file" accept="image/*" capture="environment" hidden>

<aside class="sheet" id="sheet" aria-label="보드판 내용 입력" hidden>
  <div class="sheet-head">
    <h2>보드판 내용</h2>
    <button class="done" id="editClose" type="button">완료</button>
  </div>
  <div class="sheet-body">
    <div id="rows" style="display:grid;gap:8px"></div>
    <div class="sheet-actions">
      <button id="addItem" type="button">+ 항목 추가</button>
      <button id="resetItems" type="button">기본 양식으로</button>
    </div>
    <p class="note" id="note" role="status"></p>
  </div>
</aside>

<script>
  // ───── 직접 바꿔도 되는 값 ─────
  var MAX_ITEMS = 8;                               // 보드판 최대 항목 수
  var DEFAULT_NAMES = ['동·호수', '위치', '내용']; // 기본 양식
  var WANT_WIDTH = 4000, WANT_HEIGHT = 3000;       // 카메라에 요청할 해상도(4:3)
  var ZOOM_STEP = 0.5;                             // 확대 버튼을 한 번 누를 때 바뀌는 배율
  var BOARD_SIZE = 0.62;                           // 보드판 가로 길이. 사진의 짧은 변 대비 비율이며, 줄이면 작아집니다
  // ──────────────────────────

  var FONT = '"IBM Plex Sans KR", "Noto Sans KR", "Malgun Gothic", system-ui, sans-serif';
  var CORNERS = [['bl', '왼쪽 아래'], ['br', '오른쪽 아래'], ['tr', '오른쪽 위'], ['tl', '왼쪽 위']];
  var state = {
    on: true, cornerIndex: 0, mode: 'shoot', stream: null, sampleMode: false, itemSeq: 0,
    items: [
      { name: '동·호수', value: '101동 1203호' },
      { name: '위치', value: '안방 천장' },
      { name: '내용', value: '누수 흔적 확인' }
    ]
  };
  var video = document.getElementById('video');
  var photo = document.getElementById('photo');
  var boardCanvas = document.getElementById('board');
  var statusLine = document.getElementById('status');

  function setStatus(text, ok) {
    statusLine.textContent = text;
    statusLine.classList.toggle('ok', !!ok);
  }

  function wrapText(ctx, text, maxWidth) {
    var lines = [], line = '';
    Array.from(text || ' ').forEach(function (ch) {
      if (line && ctx.measureText(line + ch).width > maxWidth) { lines.push(line); line = ch; }
      else line += ch;
    });
    lines.push(line);
    return lines;
  }

  // 사진과 같은 크기의 투명한 판에 보드판만 그립니다. 그래서 사진 원본은 건드리지 않습니다.
  function drawBoard() {
    var size = currentSize();
    boardCanvas.width = size.w;
    boardCanvas.height = size.h;
    var ctx = boardCanvas.getContext('2d');
    ctx.clearRect(0, 0, size.w, size.h);
    if (!state.on || !state.items.length) return;

    var w = size.w, h = size.h;
    // 세로든 가로든 사진 속 보드판 크기가 같도록 짧은 변을 기준으로 정합니다.
    var boardW = Math.round(Math.min(w, h) * BOARD_SIZE);
    var unit = boardW / 460;
    var margin = Math.round(Math.min(w, h) * 0.03);
    var labelW = 110 * unit, pad = 12 * unit, fontSize = 23 * unit, lineH = 32 * unit;
    ctx.font = '600 ' + fontSize + 'px ' + FONT;
    var rows = state.items.map(function (item) {
      var labelLines = wrapText(ctx, item.name, labelW - pad * 2);
      var valueLines = wrapText(ctx, item.value, boardW - labelW - pad * 2);
      return { labelLines: labelLines, valueLines: valueLines, height: Math.max(labelLines.length, valueLines.length) * lineH + pad * 1.2 };
    });
    var boardH = rows.reduce(function (sum, row) { return sum + row.height; }, 0);
    var corner = CORNERS[state.cornerIndex][0];
    var x = corner[1] === 'l' ? margin : w - boardW - margin;
    var y = corner[0] === 't' ? margin : h - boardH - margin;

    ctx.fillStyle = '#ffffff';
    ctx.fillRect(x, y, boardW, boardH);
    ctx.fillStyle = '#e8ece9';
    ctx.fillRect(x, y, labelW, boardH);
    ctx.strokeStyle = '#111111';
    ctx.lineWidth = Math.max(1, 2 * unit);
    ctx.strokeRect(x, y, boardW, boardH);
    ctx.textBaseline = 'middle';
    var top = y;
    rows.forEach(function (row, index) {
      if (index) { ctx.beginPath(); ctx.moveTo(x, top); ctx.lineTo(x + boardW, top); ctx.stroke(); }
      ctx.fillStyle = '#111111';
      ctx.font = '700 ' + fontSize + 'px ' + FONT;
      row.labelLines.forEach(function (text, i) { ctx.fillText(text, x + pad, top + pad * 0.6 + lineH * (i + 0.5)); });
      ctx.font = '600 ' + fontSize + 'px ' + FONT;
      row.valueLines.forEach(function (text, i) { ctx.fillText(text, x + labelW + pad, top + pad * 0.6 + lineH * (i + 0.5)); });
      top += row.height;
    });
    ctx.beginPath();
    ctx.moveTo(x + labelW, y);
    ctx.lineTo(x + labelW, y + boardH);
    ctx.stroke();
  }

  function currentSize() {
    if (state.mode === 'review' || state.sampleMode) return { w: photo.width || 900, h: photo.height || 1200 };
    return { w: video.videoWidth || 900, h: video.videoHeight || 1200 };
  }

  function drawSample() {
    photo.width = 900;
    photo.height = 1200;
    var ctx = photo.getContext('2d');
    ctx.fillStyle = '#e9e5da';
    ctx.fillRect(0, 0, 900, 1200);
    ctx.fillStyle = '#f7f6f1';
    ctx.fillRect(0, 0, 900, 220);
    ctx.fillStyle = '#b9b4a6';
    ctx.fillRect(0, 220, 900, 8);
    ctx.fillStyle = 'rgba(122, 94, 58, .34)';
    ctx.beginPath();
    ctx.ellipse(560, 400, 190, 100, -.1, 0, Math.PI * 2);
    ctx.fill();
    ctx.strokeStyle = '#6d6455';
    ctx.lineWidth = 4;
    ctx.beginPath();
    ctx.moveTo(560, 228);
    ctx.lineTo(530, 340);
    ctx.lineTo(585, 460);
    ctx.lineTo(560, 590);
    ctx.stroke();
  }

  function showSample(reason) {
    state.sampleMode = true;
    drawSample();
    video.hidden = true;
    photo.hidden = false;
    setStatus('카메라 열기 실패: ' + reason + '. 예시 그림으로 표시 중입니다.');
    drawBoard();
  }

  // ───── 카메라와 렌즈 ─────
  var LENS_KEY = 'album.lens';
  var lens = { list: [], index: 0, autoChecked: false };
  var zoom = null;

  function savedLens() {
    try { return localStorage.getItem(LENS_KEY) || ''; } catch (error) { return ''; }
  }
  function saveLens(id) {
    try { localStorage.setItem(LENS_KEY, id); } catch (error) {}
  }

  function stopCamera() {
    if (state.stream) state.stream.getTracks().forEach(function (track) { track.stop(); });
    state.stream = null;
  }

  function cameraConstraints(deviceId) {
    var video = { width: { ideal: WANT_WIDTH }, height: { ideal: WANT_HEIGHT }, aspectRatio: { ideal: 4 / 3 } };
    if (deviceId) video.deviceId = { exact: deviceId };
    else video.facingMode = { ideal: 'environment' };
    return { video: video, audio: false };
  }

  function openStream(deviceId) {
    stopCamera();
    return navigator.mediaDevices.getUserMedia(cameraConstraints(deviceId)).then(function (stream) {
      state.stream = stream;
      state.sampleMode = false;
      video.srcObject = stream;
      video.hidden = false;
      photo.hidden = true;
      document.getElementById('tools').hidden = false;
      return video.play().then(function () { return stream; });
    });
  }

  function currentDeviceId(stream) {
    var track = stream.getVideoTracks()[0];
    var settings = track && track.getSettings ? track.getSettings() : {};
    return settings.deviceId || '';
  }

  // 후면 렌즈만 고릅니다. 이름에 전면 표시가 있으면 뺍니다.
  function refreshLensList() {
    return navigator.mediaDevices.enumerateDevices().then(function (devices) {
      lens.list = devices.filter(function (device) {
        return device.kind === 'videoinput' && !/front|전면/i.test(device.label);
      });
    });
  }

  function preferredLensIndex() {
    var named = lens.list.findIndex(function (device) { return /camera2?\s*0\b/i.test(device.label); });
    return named >= 0 ? named : 0;
  }

  function updateLensButton() {
    var button = document.getElementById('lensNext');
    button.hidden = lens.list.length < 2;
    button.textContent = '렌즈 ' + (lens.index + 1) + '/' + lens.list.length;
  }

  // 휴대폰이 지원하면 확대 버튼을 보여 줍니다.
  function setupZoom(stream) {
    var track = stream.getVideoTracks()[0];
    var caps = track && track.getCapabilities ? track.getCapabilities() : {};
    var box = document.getElementById('zoomBox');
    if (!caps.zoom || !(caps.zoom.max > caps.zoom.min)) {
      zoom = null;
      box.hidden = true;
      return;
    }
    var settings = track.getSettings ? track.getSettings() : {};
    zoom = { track: track, min: caps.zoom.min, max: caps.zoom.max, value: settings.zoom || caps.zoom.min };
    box.hidden = false;
    showZoom();
  }
  function showZoom() {
    document.getElementById('zoomValue').textContent = zoom.value.toFixed(1) + '×';
    document.getElementById('zoomOut').disabled = zoom.value <= zoom.min;
    document.getElementById('zoomIn').disabled = zoom.value >= zoom.max;
  }
  function changeZoom(direction) {
    if (!zoom) return;
    var next = Math.min(zoom.max, Math.max(zoom.min, zoom.value + direction * ZOOM_STEP));
    zoom.track.applyConstraints({ advanced: [{ zoom: next }] }).then(function () {
      zoom.value = next;
      showZoom();
    }).catch(function () {
      document.getElementById('zoomBox').hidden = true;
    });
  }

  function useLens(index) {
    lens.index = index;
    var id = lens.list[index].deviceId;
    return openStream(id).then(function (stream) {
      saveLens(id);
      updateLensButton();
      setupZoom(stream);
      return stream;
    });
  }

  function startCamera() {
    if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
      showSample('이 환경에서 카메라 기능을 지원하지 않음');
      return;
    }
    var saved = savedLens();
    openStream(saved).catch(function (error) {
      // 저장된 렌즈가 없어졌으면 기본 후면 카메라로 다시 엽니다.
      if (saved) {
        saved = '';
        return openStream('');
      }
      throw error;
    }).then(function (stream) {
      // 권한을 받은 뒤에야 렌즈 이름을 읽을 수 있습니다.
      return refreshLensList().then(function () {
        var currentId = currentDeviceId(stream);
        var found = lens.list.findIndex(function (device) { return device.deviceId === currentId; });
        if (!saved && lens.list.length > 1) {
          var preferred = preferredLensIndex();
          if (found !== preferred) return useLens(preferred);
        }
        lens.index = found >= 0 ? found : 0;
        updateLensButton();
        setupZoom(stream);
      });
    }).catch(function (error) {
      showSample((error && error.name) || '알 수 없는 오류');
    });
  }

  function showCameraReady() {
    if (state.mode !== 'shoot' || !state.on || !video.videoWidth) return;
    setStatus('렌즈 ' + (lens.index + 1) + ', ' + video.videoWidth + ' × ' + video.videoHeight, true);
    drawBoard();
  }
  video.addEventListener('loadedmetadata', showCameraReady);
  // 휴대폰을 돌리면 카메라 영상의 가로세로가 바뀌므로 보드판도 새 크기로 다시 그립니다.
  video.addEventListener('resize', showCameraReady);
  window.addEventListener('resize', showCameraReady);

  function takePhoto() {
    if (state.sampleMode) {
      state.mode = 'review';
    } else {
      if (!video.videoWidth) return;
      photo.width = video.videoWidth;
      photo.height = video.videoHeight;
      photo.getContext('2d').drawImage(video, 0, 0);
      state.mode = 'review';
      video.pause();
      video.hidden = true;
      photo.hidden = false;
      document.getElementById('tools').hidden = true;
      setStatus('찍은 사진 ' + photo.width + ' × ' + photo.height + ', 저장은 v0.2에서 연결됩니다.', true);
    }
    document.getElementById('shootBar').hidden = true;
    document.getElementById('reviewBar').hidden = false;
    drawBoard();
  }

  function retake() {
    state.mode = 'shoot';
    document.getElementById('shootBar').hidden = false;
    document.getElementById('reviewBar').hidden = true;
    applyCameraMode();
  }

  // 보드판을 켜면 앱 카메라, 끄면 휴대폰 기본 카메라를 씁니다.
  function applyCameraMode() {
    var hint = document.getElementById('hint');
    var editButton = document.getElementById('editOpen');
    var cornerButton = document.getElementById('cornerNext');
    editButton.disabled = !state.on;
    cornerButton.disabled = !state.on;
    if (state.on) {
      hint.hidden = true;
      photo.hidden = true;
      if (state.stream) {
        video.hidden = false;
        document.getElementById('tools').hidden = false;
        video.play();
        showCameraReady();
      } else {
        setStatus('카메라를 여는 중입니다.');
        startCamera();
      }
    } else {
      stopCamera();
      video.srcObject = null;
      video.hidden = true;
      photo.hidden = true;
      document.getElementById('tools').hidden = true;
      hint.hidden = false;
      showNativeCount();
      setStatus('기본 카메라 모드', true);
    }
    drawBoard();
  }

  // ───── 기본 카메라 복귀 시험: 앱이 새로 열리며 사진이 사라지는지 횟수를 셉니다 ─────
  var PENDING_KEY = 'album.pendingCamera', SUCCESS_KEY = 'album.nativeSuccess', LOST_KEY = 'album.nativeLost';
  var nativeWatch = null;
  function readStore(key) { try { return localStorage.getItem(key) || ''; } catch (error) { return ''; } }
  function writeStore(key, value) {
    try {
      if (value === null) localStorage.removeItem(key); else localStorage.setItem(key, value);
    } catch (error) {}
  }
  function addCount(key) { writeStore(key, String(Number(readStore(key) || 0) + 1)); }
  function showNativeCount() {
    document.getElementById('nativeCount').textContent =
      '시험 결과: 성공 ' + Number(readStore(SUCCESS_KEY) || 0) + '회, 사진 사라짐 ' + Number(readStore(LOST_KEY) || 0) + '회';
  }
  function openNativeCamera() {
    writeStore(PENDING_KEY, String(Date.now()));
    document.getElementById('nativeInput').click();
  }
  function cancelNative(message) {
    writeStore(PENDING_KEY, null);
    if (state.mode === 'shoot' && !state.on) setStatus(message);
  }
  var nativeInput = document.getElementById('nativeInput');
  nativeInput.addEventListener('cancel', function () { cancelNative('촬영을 취소했습니다.'); });
  // 취소 신호가 오지 않는 휴대폰을 위해, 돌아온 뒤 사진이 없으면 취소로 봅니다.
  document.addEventListener('visibilitychange', function () {
    if (document.visibilityState !== 'visible' || !readStore(PENDING_KEY)) return;
    clearTimeout(nativeWatch);
    nativeWatch = setTimeout(function () {
      if (readStore(PENDING_KEY)) cancelNative('촬영을 취소했습니다.');
    }, 5000);
  });
  nativeInput.addEventListener('change', function (event) {
    var file = event.target.files && event.target.files[0];
    event.target.value = '';
    clearTimeout(nativeWatch);
    writeStore(PENDING_KEY, null);
    if (!file) return;
    var url = URL.createObjectURL(file);
    var image = new Image();
    image.onload = function () {
      addCount(SUCCESS_KEY);
      var scale = Math.min(1, WANT_WIDTH / Math.max(image.naturalWidth, image.naturalHeight));
      photo.width = Math.round(image.naturalWidth * scale);
      photo.height = Math.round(image.naturalHeight * scale);
      photo.getContext('2d').drawImage(image, 0, 0, photo.width, photo.height);
      URL.revokeObjectURL(url);
      state.mode = 'review';
      document.getElementById('hint').hidden = true;
      photo.hidden = false;
      document.getElementById('shootBar').hidden = true;
      document.getElementById('reviewBar').hidden = false;
      setStatus('기본 카메라 사진 ' + image.naturalWidth + ' × ' + image.naturalHeight + ', 원본 ' + (file.size / 1048576).toFixed(1) + 'MB');
      drawBoard();
    };
    image.onerror = function () {
      URL.revokeObjectURL(url);
      setStatus('이 사진은 열 수 없습니다. 다시 찍어 주세요.');
    };
    image.src = url;
  });

  function renderRows() {
    var rows = document.getElementById('rows');
    rows.innerHTML = '';
    state.items.forEach(function (item) {
      if (item.id === undefined) item.id = state.itemSeq++;
      var row = document.createElement('div');
      row.className = 'row';
      var name = document.createElement('input');
      name.className = 'name';
      name.id = 'name' + item.id;
      name.maxLength = 8;
      name.value = item.name;
      name.setAttribute('aria-label', '항목 이름');
      name.addEventListener('input', function () { item.name = name.value; drawBoard(); });
      var value = document.createElement('input');
      value.id = 'value' + item.id;
      value.maxLength = 80;
      value.value = item.value;
      value.setAttribute('aria-label', (item.name || '항목') + ' 내용');
      value.addEventListener('input', function () { item.value = value.value; drawBoard(); });
      var remove = document.createElement('button');
      remove.type = 'button';
      remove.className = 'remove';
      remove.textContent = '삭제';
      remove.setAttribute('aria-label', (item.name || '이름 없는') + ' 항목 삭제');
      remove.addEventListener('click', function () {
        state.items.splice(state.items.indexOf(item), 1);
        renderRows();
        drawBoard();
      });
      row.appendChild(name);
      row.appendChild(value);
      row.appendChild(remove);
      rows.appendChild(row);
    });
    var full = state.items.length >= MAX_ITEMS;
    document.getElementById('addItem').disabled = full;
    document.getElementById('note').textContent = full ? '항목은 ' + MAX_ITEMS + '개까지 넣을 수 있습니다.'
      : (state.items.length ? '' : '항목이 없으면 보드판이 표시되지 않습니다.');
  }

  function setSheet(open) {
    document.getElementById('sheet').hidden = !open;
    if (open) renderRows();
  }

  function setSwitch() {
    var button = document.getElementById('boardSwitch');
    button.setAttribute('aria-pressed', String(state.on));
    document.getElementById('switchText').textContent = state.on ? '켜짐' : '꺼짐';
  }
  document.getElementById('boardSwitch').addEventListener('click', function () {
    state.on = !state.on;
    writeStore('album.board', state.on ? 'on' : 'off');
    setSwitch();
    // 찍은 사진을 보는 중이면 보드판 표시만 바꿉니다.
    if (state.mode === 'review') drawBoard();
    else applyCameraMode();
  });
  document.getElementById('shutter').addEventListener('click', function () {
    if (state.on) takePhoto();
    else openNativeCamera();
  });
  document.getElementById('lensNext').addEventListener('click', function () {
    var button = this;
    button.disabled = true;
    useLens((lens.index + 1) % lens.list.length).catch(function (error) {
      setStatus('렌즈를 바꾸지 못했습니다: ' + ((error && error.name) || '알 수 없는 오류'));
      return openStream('');
    }).then(function () { button.disabled = false; });
  });
  document.getElementById('zoomOut').addEventListener('click', function () { changeZoom(-1); });
  document.getElementById('zoomIn').addEventListener('click', function () { changeZoom(1); });
  document.getElementById('retake').addEventListener('click', retake);
  document.getElementById('editOpen').addEventListener('click', function () { setSheet(true); });
  document.getElementById('editOpen2').addEventListener('click', function () { setSheet(true); });
  document.getElementById('editClose').addEventListener('click', function () { setSheet(false); });
  document.getElementById('cornerNext').addEventListener('click', function () {
    state.cornerIndex = (state.cornerIndex + 1) % CORNERS.length;
    document.getElementById('cornerText').textContent = CORNERS[state.cornerIndex][1];
    drawBoard();
  });
  document.getElementById('addItem').addEventListener('click', function () {
    if (state.items.length >= MAX_ITEMS) return;
    var item = { name: '새 항목', value: '' };
    state.items.push(item);
    renderRows();
    drawBoard();
    var input = document.getElementById('name' + item.id);
    input.focus();
    input.select();
  });
  document.getElementById('resetItems').addEventListener('click', function () {
    state.items = DEFAULT_NAMES.map(function (name) { return { name: name, value: '' }; });
    renderRows();
    drawBoard();
  });

  // 화질 비교용: 사진과 보드판을 합친 JPEG를 휴대폰에 내려받습니다. 어디로도 전송하지 않습니다.
  var testSave = document.getElementById('testSave');
  if (window.top === window) {
    testSave.hidden = false;
    document.getElementById('saveSpacer').hidden = true;
  }
  testSave.addEventListener('click', function () {
    var merged = document.createElement('canvas');
    merged.width = photo.width;
    merged.height = photo.height;
    var context = merged.getContext('2d');
    context.drawImage(photo, 0, 0);
    if (state.on && state.items.length) context.drawImage(boardCanvas, 0, 0);
    merged.toBlob(function (blob) {
      if (!blob) { setStatus('사진을 만들지 못했습니다. 다시 찍어 주세요.'); return; }
      var url = URL.createObjectURL(blob);
      var link = document.createElement('a');
      var now = new Date();
      link.href = url;
      link.download = '보드판시험_' + now.getHours() + '시' + now.getMinutes() + '분' + now.getSeconds() + '초.jpg';
      document.body.appendChild(link);
      link.click();
      link.remove();
      setTimeout(function () { URL.revokeObjectURL(url); }, 60000);
      setStatus('저장 요청 완료, ' + photo.width + ' × ' + photo.height + ', ' + (blob.size / 1048576).toFixed(1) + 'MB');
    }, 'image/jpeg', 0.92);
  });

  var fullButton = document.getElementById('fullButton');
  if (document.fullscreenEnabled && document.documentElement.requestFullscreen) {
    fullButton.hidden = false;
    fullButton.addEventListener('click', function () {
      var action = document.fullscreenElement ? document.exitFullscreen() : document.documentElement.requestFullscreen();
      if (action && action.catch) action.catch(function () { fullButton.hidden = true; });
    });
    document.addEventListener('fullscreenchange', function () {
      fullButton.textContent = document.fullscreenElement ? '전체 화면 닫기' : '전체 화면';
    });
  }

  drawBoard();
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(drawBoard);
  state.on = readStore('album.board') !== 'off';
  setSwitch();
  var returnedLost = !!readStore(PENDING_KEY);
  if (returnedLost) {
    addCount(LOST_KEY);
    writeStore(PENDING_KEY, null);
  }
  applyCameraMode();
  if (returnedLost) setStatus('카메라에서 돌아오며 앱이 새로 열려 사진이 전달되지 않았습니다.');
</script>

</body>
